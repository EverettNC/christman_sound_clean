[build-system]
# setuptools 70.1 is the first that carries bdist_wheel itself
# (scripts/pip_build.py tags the wheel for its platform with it).
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

# This file is the one place the package's metadata and dependencies live.
# setup.py is a shim that calls setup() with nothing in it (see its header).
#
# WHAT CHANGED AND WHY (2026-11-05)
# Everett: "I want the sound package to be an installable package. I want
# people to be able to just download it and install it." pip install now
# builds the C library: christman_dsp.c, christman_synth.c and
# christman_vocoder.c are compiled into christman_voice_sdk/engines/christman_dsp.so by
# scripts/build_dsp.py, which pip runs through scripts/pip_build.py (the
# [tool.setuptools.cmdclass] table below). One command, nothing after it:
#
#     pip install .        or        pip install -e .
#
# It needs a C compiler (Xcode Command Line Tools on a Mac). With none, or if
# the library does not load whole, pip install fails and says why; nothing is
# installed that cannot measure or speak.
#
# The ear is Vosk (a base dependency below); it has nothing to compile here.

[project]
name = "christman-sound"
version = "1.0.0"
description = "Christman Sound — audio, voice, and speech SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Everett Nathaniel Christman", email = "lumacognify@thechristmanaiproject.com" },
]
# WHAT CHANGED AND WHY (2026-10-28, Lane 6)
# - "librosa" removed. No file in the package imports it. It pulled
#   numba -> llvmlite 0.50.0, which has no Intel Mac (x86_64 macOS) wheel and
#   does not build from source there, so a fresh `pip install -e .` failed on
#   Everett's Intel Mac before anything else was installed. With librosa gone,
#   nothing declared here pulls numba or llvmlite, so no pin is needed for
#   them. If one is ever added back, pin numba<0.61 and llvmlite<0.44 on
#   Intel Mac: those are the last versions with x86_64 macOS wheels.
# - Added what the package imports at module top but did not declare:
#   scipy (audio_processor, voice_capture_client, the tone engines),
#   PyYAML (audio/config.py, imported by christman_voice_sdk/__init__.py),
#   and werkzeug (synthesis/tts_service.py imports it by name; flask needs it too).
# - cryptography is optional (voicepack encryption), so it is the "crypto"
#   extra, not a base dependency.
# WHAT CHANGED AND WHY (2026-10-29)
# - crypto_bridge.py was removed from this repository, with its references
#   here. christman_ocr_shared.py stays, being-neutral: it speaks through
#   christman_sound.
# - "websockets" removed. Nothing in the package imports it any more: the OCR
#   and voice_capture_client both speak through christman_sound, and the relay
#   that needed a websocket is gone.
dependencies = [
    "numpy<2",
    "scipy",
    "soundfile",
    "PyYAML",
    # Intel Mac ceiling: PyTorch stopped publishing x86_64 macOS wheels after
    # 2.2.2. The marker keeps other platforms unpinned.
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # transformers>=5 hard-requires torch>=2.4, which has no Intel Mac wheel.
    "transformers>=4.40,<5",
    # 2026-10-17: "pyttsx3" removed — the OS speech engine. Everett's ruling
    # cuts every outside speech engine; nothing in the package imports it.
    "flask",
    "werkzeug",
    "fastapi",
    "rich",
    "praat-parselmouth",  # PyPI name is praat-parselmouth, not parselmouth
    # 2026-11-05 (Everett): Vosk is the ear. christman_voice_sdk.audio.ear hears through
    # Vosk's recognizer on a model folder on disk (the full
    # vosk-model-en-us-0.22), the recognizer the Filament runs.
    "vosk",
    # 2026-11-05: the Voice Creation Center is inside the package
    # (voice_creation_center/). Its ingestor splits and converts audio with
    # pydub; any input that is not already .wav also needs the ffmpeg program.
    "pydub>=0.25.1",
    # Python 3.13 removed the audioop module pydub imports; audioop-lts puts it back.
    "audioop-lts; python_version >= '3.13'",
]

[project.optional-dependencies]
# Voicepack encryption (timbre/voicepack.py).
crypto = ["cryptography"]
# Microphone capture (integration/voice_capture_client.capture_audio, and the
# Voice Creation Center's live studio recorder). On a Mac, sounddevice also
# needs PortAudio: brew install portaudio.
capture = ["sounddevice"]
# Local speech recognition: vosk is a base dependency (2026-11-05, above). The
# model is not a package: point VOSK_MODEL_PATH at a model folder on disk
# (~/models/vosk-model-en-us-0.22 or ~/Downloads/vosk-model-en-us-0.22 are
# found on their own). From 2026-10-29 to 2026-11-05 the ear was a decoder of
# this package's own with a C library to build; it is held, not installed, in
# held/claude-ear-2026-10-28.

[project.scripts]
christman-sound = "voice_creation_center.app:main"
christman-sound-install = "voice_creation_center.app:main_install"
christman-tts = "christman_voice_sdk.synthesis.tts_service:main"
christman-corti = "christman_voice_sdk.audio.corti_receiver:main"
christman-word-ear = "christman_voice_sdk.audio.word_ear_receiver:main"
# WHAT CHANGED AND WHY (2026-11-05): the Filament ear server moved into the
# package (christman_voice_sdk/audio/filament, from THEFILAMENT ear/vosk_ear.py).
# (This line and the pages line under package-data were on the Filament's
# branch and were lost when that branch was joined with main in 11169a2: an
# installed copy had no christman-filament command and none of its pages.
# Put back the same day.)
christman-filament = "christman_voice_sdk.audio.filament.server:main"
# 2026-11-05: was voice_capture_client:_cli, a function that does not exist,
# so christman-capture failed with an ImportError on every install. Its
# command line is main().
christman-capture = "christman_voice_sdk.integration.voice_capture_client:main"
# 2026-11-05: "christman-build-dsp = scripts.build_dsp:main" removed. scripts/
# is not installed, so that command failed with ModuleNotFoundError after
# every install, editable or not. pip builds the library now; in a checkout,
# python3 scripts/build_dsp.py --check rebuilds it.

[tool.setuptools]
py-modules = ["christman_ocr_shared"]

# 2026-11-05: the C library is the last step of setuptools' build (see the
# header). The classes live in scripts/pip_build.py, which is not installed.
[tool.setuptools.cmdclass]
build = "scripts.pip_build.build"
build_christman_dsp = "scripts.pip_build.build_christman_dsp"
bdist_wheel = "scripts.pip_build.bdist_wheel"

[tool.setuptools.packages.find]
include = ["christman_voice_sdk*", "voice_creation_center*"]

[tool.setuptools.package-data]
christman_voice_sdk = ["py.typed"]
# 2026-11-05: "*.so" and "*.dylib" removed. The build compiles the library
# into the wheel itself (scripts/pip_build.py); a library left over in a
# checkout from an earlier build must not ride into the wheel beside it.
# The Filament's pages and its dialect map, with FROZEN.md (2026-11-05).
"christman_voice_sdk.audio.filament" = ["pages/*"]
# The VCC's express index (empty until phrases are registered) and its notes.
voice_creation_center = ["express/express_index.json", "*.md", "static/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: every non-pass outcome is listed with its reason. A test that could
# not run is reported as NOT RUN (see tests/conftest.py), never as a bare "s".
addopts = "-ra"
